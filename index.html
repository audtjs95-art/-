<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>고등 내신 분석용 한 줄 영어 학습기</title>
    <!-- Pretendard 폰트 -->
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    <!-- Mermaid.js -->
    <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
    
    <style>
        :root {
            --primary-color: #1e3a8a;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --subject-color: #2563eb;
            --verb-color: #dc2626;
            --object-color: #16a34a;
            --modifier-color: #d97706;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            font-family: "Pretendard Variable", Pretendard, -apple-system, sans-serif; 
            line-height: 1.8; 
            background-color: var(--bg-color); 
            color: var(--text-main); 
            padding: 24px 16px;
            max-width: 1000px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 24px;
            padding: 20px;
            background: linear-gradient(135deg, #1e3a8a 0%, #3b82f6 100%);
            color: white;
            border-radius: 16px;
            box-shadow: 0 8px 20px rgba(30, 58, 138, 0.2);
            position: relative;
        }
        header h1 { font-size: 24px; font-weight: 800; }
        header p { font-size: 13px; opacity: 0.9; margin-top: 4px; }

        .student-badge {
            display: inline-block;
            background: #fef08a;
            color: #854d0e;
            font-size: 12px;
            font-weight: 800;
            padding: 4px 12px;
            border-radius: 20px;
            margin-top: 8px;
        }

        .card { 
            background: var(--card-bg); 
            padding: 24px; 
            border-radius: 16px; 
            margin-bottom: 24px; 
            box-shadow: 0 4px 16px rgba(0,0,0,0.04); 
            border: 1px solid #e2e8f0;
        }

        .section-title {
            font-size: 18px;
            font-weight: 700;
            color: var(--primary-color);
            margin-bottom: 16px;
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        textarea { 
            width: 100%; 
            height: 120px; 
            padding: 12px; 
            border: 2px solid #cbd5e1; 
            border-radius: 10px; 
            font-size: 13px;
            font-family: monospace;
            resize: vertical;
        }
        textarea:focus { border-color: var(--primary-color); outline: none; }
        
        .btn-group { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }

        button { 
            padding: 10px 18px; 
            border: none; 
            border-radius: 10px; 
            font-weight: 700; 
            cursor: pointer; 
            font-size: 14px; 
            transition: all 0.2s;
        }
        button.btn-primary { background-color: var(--primary-color); color: white; flex: 2; }
        button.btn-primary:hover { background-color: #1e40af; }
        button.btn-share { background-color: #059669; color: white; flex: 1; }
        button.btn-share:hover { background-color: #047857; }
        button.btn-student { background-color: #64748b; color: white; flex: 1; }
        button.btn-student:hover { background-color: #475569; }
        button.btn-sub { background-color: #e2e8f0; color: #334155; font-size: 12px; padding: 6px 12px; }
        button.btn-sub:hover { background-color: #cbd5e1; }

        /* 보기 제어 컨트롤 패널 (토글 버튼) */
        .control-panel {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            background: #f1f5f9;
            padding: 14px 18px;
            border-radius: 12px;
            margin-bottom: 20px;
            align-items: center;
            border: 1px solid #cbd5e1;
        }
        .control-panel label {
            font-size: 13.5px;
            font-weight: 700;
            color: #334155;
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            user-select: none;
            background: #ffffff;
            padding: 6px 12px;
            border-radius: 8px;
            border: 1px solid #cbd5e1;
        }
        .control-panel input[type="checkbox"] {
            width: 16px;
            height: 16px;
            accent-color: var(--primary-color);
            cursor: pointer;
        }

        /* 사전 단어 카드 테이블 */
        .vocab-table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        .vocab-table th, .vocab-table td { border: 1px solid #e2e8f0; padding: 10px 12px; font-size: 14px; }
        .vocab-table th { background-color: #f1f5f9; text-align: left; }
        .meaning-hidden { background-color: #334155 !important; color: #334155 !important; user-select: none; border-radius: 4px; }

        /* 문장별 내신 분석 카드 */
        .sentence-card {
            background: #ffffff;
            border: 1px solid #cbd5e1;
            border-left: 6px solid var(--primary-color);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
        }
        .sentence-num {
            display: inline-block;
            background: #e0e7ff;
            color: var(--primary-color);
            font-size: 12px;
            font-weight: 800;
            padding: 2px 10px;
            border-radius: 16px;
            margin-bottom: 12px;
        }

        /* 1:1 직독직해 구문 영역 */
        .chunk-container {
            display: flex;
            flex-wrap: wrap;
            gap: 10px 8px;
            margin-bottom: 12px;
            align-items: baseline;
        }
        .chunk-unit {
            background: #f8fafc;
            padding: 8px 12px;
            border-radius: 8px;
            border: 1px solid #e2e8f0;
        }
        .chunk-en { font-size: 19px; font-weight: 600; color: #0f172a; line-height: 1.6; }
        .chunk-kr { 
            font-size: 13.5px; 
            color: #475569; 
            font-weight: 500; 
            margin-top: 4px;
            border-top: 1px dashed #cbd5e1;
            padding-top: 2px;
        }

        /* 단어 툴팁 스타일 */
        .word-item { 
            position: relative; 
            display: inline-block; 
            cursor: pointer; 
            padding: 0 2px;
            border-bottom: 1.5px dotted #3b82f6;
            border-radius: 3px;
            transition: all 0.15s ease;
        }
        .word-item:hover { 
            background-color: #fef08a; 
            color: #854d0e;
            border-bottom-color: #eab308;
        }
        .word-item:hover::after {
            content: attr(data-meaning);
            position: absolute; 
            bottom: 130%; 
            left: 50%; 
            transform: translateX(-50%);
            background-color: #0f172a; 
            color: #ffffff; 
            padding: 6px 10px; 
            border-radius: 6px;
            font-size: 12px; 
            font-weight: 500; 
            white-space: nowrap; 
            z-index: 1000;
            box-shadow: 0 8px 16px rgba(0,0,0,0.25);
            pointer-events: none;
        }

        /* 구문 분석 & 수식관계 박스 */
        .syntax-box {
            background: #f1f5f9;
            border-radius: 8px;
            padding: 10px 14px;
            font-size: 14.5px;
            border: 1px dashed #cbd5e1;
            margin-top: 10px;
        }
        .modifier-box {
            background: #f0fdf4;
            border-radius: 8px;
            padding: 10px 14px;
            font-size: 14px;
            border: 1px solid #bbf7d0;
            margin-top: 6px;
            color: #166534;
        }

        .badge { display: inline-block; padding: 1px 6px; border-radius: 4px; font-size: 11px; font-weight: 800; color: white; margin: 0 2px; }
        .badge-s { background-color: var(--subject-color); }
        .badge-v { background-color: var(--verb-color); }
        .badge-o { background-color: var(--object-color); }
        .badge-m { background-color: var(--modifier-color); }

        .grammar-point-box {
            background-color: #fefce8;
            border-left: 4px solid #eab308;
            padding: 10px 14px;
            border-radius: 6px;
            margin-top: 8px;
            font-size: 14px;
        }

        /* 단어 퀴즈 영역 */
        .quiz-item {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            padding: 16px;
            border-radius: 12px;
            margin-bottom: 14px;
        }
        .quiz-question { font-size: 16px; font-weight: 700; margin-bottom: 10px; }
        .quiz-options { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .quiz-opt-btn {
            background: #ffffff;
            border: 1px solid #cbd5e1;
            padding: 10px 14px;
            border-radius: 8px;
            text-align: left;
            font-size: 14px;
            color: #334155;
            cursor: pointer;
            transition: all 0.15s;
        }
        .quiz-opt-btn:hover { background: #e0e7ff; border-color: #818cf8; }
        .quiz-opt-btn.correct { background: #dcfce7 !important; border-color: #22c55e !important; color: #15803d !important; font-weight: 700; }
        .quiz-opt-btn.wrong { background: #fee2e2 !important; border-color: #ef4444 !important; color: #b91c1c !important; }
        .quiz-score-banner {
            background: #3b82f6;
            color: white;
            padding: 12px;
            border-radius: 10px;
            text-align: center;
            font-weight: 800;
            margin-bottom: 16px;
            font-size: 16px;
        }

        .mermaid { display: flex; justify-content: center; background: #fafafa; padding: 16px; border-radius: 8px; }

        /* 토글 숨김 클래스 */
        .is-hidden { display: none !important; }
    </style>
</head>
<body>

    <header>
        <h1>📖 고등 내신 분석용 한 줄 영어 학습기</h1>
        <p>전체 단어 툴팁 · 구문 분석지 · 사전 단어 학습 및 객관식 퀴즈 지원</p>
        <div id="studentBadge" class="student-badge" style="display:none;">🎓 학생 열람 전용 모드</div>
    </header>
    
    <!-- 1. 선생님용 JSON 입력 창 -->
    <div class="card" id="jsonInputCard">
        <div class="section-title"><span>📥 AI 분석 JSON 데이터 입력</span></div>
        <textarea id="jsonInput" placeholder="AI가 생성해준 JSON 코드를 여기에 붙여넣으세요..."></textarea>
        <div class="btn-group">
            <button class="btn-primary" onclick="renderApp()">시각화 분석지 생성하기</button>
            <button class="btn-share" onclick="copyShareUrl()">🔗 학생용 공유 링크 복사</button>
            <button class="btn-student" onclick="toggleStudentView()">🎓 입력창 숨기기</button>
        </div>
    </div>

    <!-- 2. 분석지 결과 출력 영역 -->
    <div id="outputArea" style="display:none;">
        
        <!-- 온/오프 토글 제어 패널 -->
        <div class="control-panel">
            <span style="font-weight: 800; font-size: 14px; color: var(--primary-color);">⚙️ 보기 설정:</span>
            <label><input type="checkbox" id="chkSyntax" checked onchange="applyToggles()"> 구문분석 (S/V/O/C)</label>
            <label><input type="checkbox" id="chkModifier" checked onchange="applyToggles()"> 수식관계 (->)</label>
            <label><input type="checkbox" id="chkGrammar" checked onchange="applyToggles()"> 주요 어법 팁</label>
            <label><input type="checkbox" id="chkChunkTranslation" checked onchange="applyToggles()"> 직독직해 해석</label>
        </div>

        <div class="card" style="text-align: center; background: #eff6ff; border-color: #bfdbfe;">
            <h2 id="passageTitle" style="color: #1e40af; font-size: 22px;"></h2>
        </div>

        <!-- [신규 1] 지문 공부 전 핵심 어휘 사전 학습 -->
        <div class="card" id="preVocabCard">
            <div class="section-title">
                <span>📚 [학습 전] 핵심 어휘 암기노트</span>
                <button class="btn-sub" onclick="toggleMeaningHide()">👁️ 뜻 가리기 / 보이기</button>
            </div>
            <div id="preVocabArea"></div>
        </div>

        <!-- 문장별 분석 -->
        <div class="card">
            <div class="section-title"><span>🔍 [학습 중] 문장별 직독직해 & 구문 분석지</span></div>
            <div id="sentenceCardsArea"></div>
        </div>

        <div class="card">
            <div class="section-title"><span>📊 지문 흐름도 (Structure Chart)</span></div>
            <div class="mermaid" id="mermaidGraph"></div>
        </div>

        <div class="card" id="grammarCard">
            <div class="section-title"><span>💡 주요 어법 & 내신 출제 포인트</span></div>
            <div id="grammarSummaryArea"></div>
        </div>

        <div class="card">
            <div class="section-title"><span>📄 전체 자연스러운 해석</span></div>
            <p id="fullTranslation" style="line-height: 2; white-space: pre-line; font-size: 15.5px; color: #334155;"></p>
        </div>

        <!-- [신규 2] 학습 후 단어 확인 퀴즈 -->
        <div class="card" id="quizCard">
            <div class="section-title">
                <span>🧩 [학습 후] 실시간 단어 퀴즈 (Vocab Quiz)</span>
                <button class="btn-sub" onclick="generateQuiz()">🔄 퀴즈 다시 풀기</button>
            </div>
            <div id="quizScoreBanner" class="quiz-score-banner" style="display:none;"></div>
            <div id="quizArea"></div>
        </div>

    </div>

    <script>
        mermaid.initialize({ startOnLoad: false, theme: 'neutral' });

        let globalData = null;
        let isMeaningHidden = false;
        let quizScore = { correct: 0, answered: 0, total: 0 };

        function utf8_to_b64(str) { return window.btoa(unescape(encodeURIComponent(str))); }
        function b64_to_utf8(str) { return decodeURIComponent(escape(window.atob(str))); }

        window.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const dataParam = urlParams.get('data');
            if (dataParam) {
                try {
                    const jsonStr = b64_to_utf8(decodeURIComponent(dataParam));
                    document.getElementById('jsonInput').value = jsonStr;
                    document.getElementById('jsonInputCard').style.display = 'none';
                    document.getElementById('studentBadge').style.display = 'inline-block';
                    renderApp();
                } catch (e) {
                    console.error("공유 데이터 복원 실패:", e);
                }
            }
        });

        function copyShareUrl() {
            const rawInput = document.getElementById('jsonInput').value.trim();
            if (!rawInput) {
                alert("먼저 JSON 데이터를 입력하고 [시각화 분석지 생성하기]를 클릭해주세요.");
                return;
            }
            try {
                const encoded = encodeURIComponent(utf8_to_b64(rawInput));
                const shareUrl = window.location.origin + window.location.pathname + '?data=' + encoded;
                navigator.clipboard.writeText(shareUrl).then(() => {
                    alert("학생용 공유 링크가 클립보드에 복사되었습니다!\n학생들에게 이 링크를 전달해주시면 바로 분석지가 열립니다.");
                });
            } catch (e) {
                alert("링크 생성 중 오류가 발생했습니다.");
            }
        }

        function toggleStudentView() {
            const card = document.getElementById('jsonInputCard');
            if (card.style.display === 'none') {
                card.style.display = 'block';
            } else {
                card.style.display = 'none';
                document.getElementById('studentBadge').style.display = 'inline-block';
            }
        }

        function applyToggles() {
            const showSyntax = document.getElementById('chkSyntax').checked;
            const showModifier = document.getElementById('chkModifier').checked;
            const showGrammar = document.getElementById('chkGrammar').checked;
            const showChunkTrans = document.getElementById('chkChunkTranslation').checked;

            document.querySelectorAll('.syntax-box').forEach(el => {
                if (showSyntax) el.classList.remove('is-hidden'); else el.classList.add('is-hidden');
            });
            document.querySelectorAll('.modifier-box').forEach(el => {
                if (showModifier) el.classList.remove('is-hidden'); else el.classList.add('is-hidden');
            });
            const grammarCard = document.getElementById('grammarCard');
            if (showGrammar) grammarCard.classList.remove('is-hidden'); else grammarCard.classList.add('is-hidden');

            document.querySelectorAll('.chunk-kr').forEach(el => {
                if (showChunkTrans) el.classList.remove('is-hidden'); else el.classList.add('is-hidden');
            });
        }

        // 사전 어휘 뜻 가리기 토글
        function toggleMeaningHide() {
            isMeaningHidden = !isMeaningHidden;
            document.querySelectorAll('.vocab-meaning-td').forEach(td => {
                if (isMeaningHidden) td.classList.add('meaning-hidden');
                else td.classList.remove('meaning-hidden');
            });
        }

        function findWordMeaning(rawWord, wordSource) {
            if (!wordSource) return null;
            let clean = rawWord.replace(/[^a-zA-Z']/g, "").toLowerCase();
            if (!clean) return null;

            if (Array.isArray(wordSource)) {
                let match = wordSource.find(w => w.word.toLowerCase().replace(/[^a-zA-Z']/g, "") === clean);
                if (match) return match.meaning;

                match = wordSource.find(w => {
                    let target = w.word.toLowerCase().replace(/[^a-zA-Z']/g, "");
                    return (clean.startsWith(target) && clean.length - target.length <= 4) ||
                           (target.startsWith(clean) && target.length - clean.length <= 3);
                });
                if (match) return match.meaning;
            }
            return null;
        }

        // 실시간 4지선다 단어 퀴즈 생성 함수
        function generateQuiz() {
            if (!globalData || !globalData.key_vocabulary || globalData.key_vocabulary.length === 0) {
                document.getElementById('quizCard').style.display = 'none';
                return;
            }

            const vocabList = globalData.key_vocabulary;
            quizScore = { correct: 0, answered: 0, total: vocabList.length };
            
            document.getElementById('quizScoreBanner').style.display = 'none';

            let quizHtml = "";

            vocabList.forEach((item, qIdx) => {
                let correctMeaning = item.meaning;
                
                // 오답 보기 추출 (다른 단어들의 뜻)
                let otherMeanings = vocabList
                    .filter(v => v.meaning !== correctMeaning)
                    .map(v => v.meaning);
                
                // 오답 무작위 셔플 후 3개 선택
                otherMeanings.sort(() => Math.random() - 0.5);
                let options = [correctMeaning, ...otherMeanings.slice(0, 3)];

                // 보기가 4개가 안 될 경우 기본 더미 보기 보충
                const dummyOptions = ["영향을 미치다", "중요한", "결과적으로", "설명하다", "분석하다"];
                while (options.length < 4) {
                    let dummy = dummyOptions[Math.floor(Math.random() * dummyOptions.length)];
                    if (!options.includes(dummy)) options.push(dummy);
                }

                // 전체 보기 셔플
                options.sort(() => Math.random() - 0.5);

                quizHtml += `
                <div class="quiz-item" id="quiz-item-${qIdx}">
                    <div class="quiz-question">
                        Q${qIdx + 1}. <strong style="color:var(--primary-color); font-size:18px;">${item.word}</strong> 
                        <span style="font-size:13px; color:#64748b; font-weight:normal;">(${item.pos || '단어'})</span>의 뜻은?
                    </div>
                    <div class="quiz-options">`;
                
                options.forEach(opt => {
                    const isCorrect = (opt === correctMeaning);
                    quizHtml += `<button class="quiz-opt-btn" onclick="checkAnswer(${qIdx}, ${isCorrect}, this)">${opt}</button>`;
                });

                quizHtml += `</div></div>`;
            });

            document.getElementById('quizArea').innerHTML = quizHtml;
        }

        // 퀴즈 정답 채점 함수
        function checkAnswer(qIdx, isCorrect, btnEl) {
            const parent = document.getElementById(`quiz-item-${qIdx}`);
            const buttons = parent.querySelectorAll('.quiz-opt-btn');
            
            // 이미 푼 문제는 입력 방지
            if (parent.dataset.answered) return;
            parent.dataset.answered = "true";

            quizScore.answered++;

            buttons.forEach(btn => {
                btn.style.cursor = 'default';
            });

            if (isCorrect) {
                btnEl.classList.add('correct');
                quizScore.correct++;
            } else {
                btnEl.classList.add('wrong');
                // 정답 보기 초록색으로 힌트 표시
                buttons.forEach(btn => {
                    if (btn.innerText === globalData.key_vocabulary[qIdx].meaning) {
                        btn.classList.add('correct');
                    }
                });
            }

            // 전체 다 풀었을 때 상단 스코어 뷰
            if (quizScore.answered === quizScore.total) {
                const banner = document.getElementById('quizScoreBanner');
                const scorePercent = Math.round((quizScore.correct / quizScore.total) * 100);
                banner.innerText = `🎉 퀴즈 완료! 총 ${quizScore.total}문제 중 ${quizScore.correct}개 맞춤 (${scorePercent}점)`;
                banner.style.display = 'block';
            }
        }

        function renderApp() {
            try {
                let rawInput = document.getElementById('jsonInput').value.trim();
                rawInput = rawInput.replace(/^```json/i, '').replace(/^```/, '').replace(/```$/, '').trim();
                globalData = JSON.parse(rawInput);
                const data = globalData;
                
                document.getElementById('passageTitle').innerText = "📌 " + (data.title || "영어 지문 분석");
                document.getElementById('fullTranslation').innerText = data.full_translation || "";

                // [신규 1] 사전 핵심 어휘 랜더링
                if (data.key_vocabulary && data.key_vocabulary.length > 0) {
                    let preVocabHtml = `<table class="vocab-table">
                        <thead><tr><th>표현 (Word)</th><th>품사</th><th>뜻 (Meaning)</th><th>유의어</th></tr></thead><tbody>`;
                    data.key_vocabulary.forEach(v => {
                        preVocabHtml += `<tr>
                            <td><strong style="color:#1e40af; font-size:15px;">${v.word}</strong></td>
                            <td>${v.pos || '-'}</td>
                            <td class="vocab-meaning-td"><strong>${v.meaning}</strong></td>
                            <td>${v.synonym || '-'}</td>
                        </tr>`;
                    });
                    preVocabHtml += "</tbody></table>";
                    document.getElementById('preVocabArea').innerHTML = preVocabHtml;
                    document.getElementById('preVocabCard').style.display = 'block';
                } else {
                    document.getElementById('preVocabCard').style.display = 'none';
                }

                // 문장별 분석지 랜더링
                let sentenceCardsHtml = "";
                if (data.segmented_text && data.segmented_text.length > 0) {
                    let sentences = [];
                    let currentSentence = [];

                    data.segmented_text.forEach(item => {
                        currentSentence.push(item);
                        if (/[.!?]"?$/.test(item.chunk.trim())) {
                            sentences.push([...currentSentence]);
                            currentSentence = [];
                        }
                    });
                    if (currentSentence.length > 0) sentences.push(currentSentence);

                    sentences.forEach((sChunks, idx) => {
                        sentenceCardsHtml += `
                        <div class="sentence-card">
                            <span class="sentence-num">문장 #${String(idx + 1).padStart(2, '0')}</span>
                            <div class="chunk-container">`;
                        
                        let fullSentenceEnText = "";

                        sChunks.forEach(c => {
                            fullSentenceEnText += c.chunk + " ";
                            let rawWords = c.chunk.split(' ');
                            let chunkWordsHtml = "";

                            rawWords.forEach(w => {
                                let meaning = findWordMeaning(w, data.words);
                                if (meaning) {
                                    chunkWordsHtml += `<span class="word-item" data-meaning="${meaning}">${w}</span> `;
                                } else {
                                    chunkWordsHtml += `<span class="word-item" data-meaning="${w}">${w}</span> `;
                                }
                            });

                            sentenceCardsHtml += `
                                <div class="chunk-unit">
                                    <div class="chunk-en">${chunkWordsHtml}</div>
                                    <div class="chunk-kr">${c.translation}</div>
                                </div>`;
                        });

                        sentenceCardsHtml += `</div>`;

                        if (data.syntax_analysis) {
                            let matchSyntax = data.syntax_analysis.find(syn => 
                                fullSentenceEnText.includes(syn.sentence.substring(0, 12)) || syn.sentence.includes(sChunks[0].chunk.substring(0, 12))
                            );

                            if (matchSyntax) {
                                let formattedAnalysis = matchSyntax.analysis
                                    .replace(/\[S\]|\(S\)|\[주어\]/g, '<span class="badge badge-s">S</span>')
                                    .replace(/\[V\]|\(V\)|\[동사\]/g, '<span class="badge badge-v">V</span>')
                                    .replace(/\[O\]|\(O\)|\[목적어\]|\[C\]|\(C\)|\[보어\]/g, '<span class="badge badge-o">O/C</span>')
                                    .replace(/\[M\]|\(M\)|\[수식어\]/g, '<span class="badge badge-m">M</span>');

                                sentenceCardsHtml += `
                                <div class="syntax-box">
                                    <strong>📌 구문 분석:</strong> ${formattedAnalysis}
                                </div>`;

                                if (matchSyntax.modifier_relation) {
                                    sentenceCardsHtml += `
                                    <div class="modifier-box">
                                        <strong>🔗 수식 관계 및 구조:</strong> ${matchSyntax.modifier_relation}
                                    </div>`;
                                }
                            }
                        }

                        sentenceCardsHtml += `</div>`;
                    });
                }
                document.getElementById('sentenceCardsArea').innerHTML = sentenceCardsHtml;

                if (data.key_grammar) {
                    let grammarHtml = "";
                    data.key_grammar.forEach(g => {
                        grammarHtml += `
                        <div class="grammar-point-box">
                            <strong>[${g.point}]</strong> <code>${g.target_text}</code>
                            <div style="margin-top:2px; color:#451a03;">👉 ${g.explanation}</div>
                        </div>`;
                    });
                    document.getElementById('grammarSummaryArea').innerHTML = grammarHtml;
                }

                if (data.structure_chart) {
                    const graphDiv = document.getElementById('mermaidGraph');
                    graphDiv.removeAttribute('data-processed');
                    graphDiv.innerHTML = data.structure_chart;
                    mermaid.run({ nodes: [graphDiv] });
                }

                // [신규 2] 단어 퀴즈 생성
                generateQuiz();

                document.getElementById('outputArea').style.display = 'block';
                applyToggles();
            } catch (e) {
                console.error(e);
                alert('JSON 데이터 변환 중 오류가 발생했습니다.');
            }
        }
    </script>
</body>
</html>
